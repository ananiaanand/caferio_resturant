# Local dev / CLI config (`supabase start`). For a HOSTED project set the same values in
# Dashboard -> Authentication (see README section 3). Only the relevant parts are shown; merge
# them into the config.toml that `supabase init` generated.

[auth]
enable_signup = false               # GoTrue /signup closed. (DB trigger also blocks it — defence in depth.)
enable_anonymous_sign_ins = false
jwt_expiry = 3600                   # access token: 1 h
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10   # seconds; reuse of an old refresh token revokes the family

[auth.email]
enable_signup = false
enable_confirmations = false        # users are created pre-confirmed by the Edge Function; no mail is ever sent
double_confirm_changes = true
secure_password_change = true       # GoTrue itself also demands recent login for password change via /user

[auth.password]                     # (older CLI versions: minimum_password_length = 8 under [auth])
# minimum_password_length = 8

# Edge Functions authenticate their callers themselves (login/register have no user yet;
# the other two validate the bearer token with GoTrue AND check the DB role).
[functions.auth-login]
verify_jwt = false
[functions.auth-register]
verify_jwt = false
[functions.auth-change-password]
verify_jwt = false
[functions.auth-admin-reset-password]
verify_jwt = false
